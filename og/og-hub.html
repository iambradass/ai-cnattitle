<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG · Tech Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: #1a2332;
    color: #fff;
    position: relative;
    width: 1200px;
    height: 630px;
  }

  /* Decorative layers */
  .bg-glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 80% at 100% 0%, rgba(250,237,54,0.14), transparent 65%),
      radial-gradient(ellipse 60% 85% at 0% 100%, rgba(45,125,210,0.16), transparent 65%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,0,0,0.85) 40%, transparent 90%);
  }

  .frame {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    padding: 56px 72px 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    width: 190px;
    margin-bottom: 26px;
  }
  .logo img { width: 100%; height: auto; display: block; }

  h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: 70px;
    line-height: 1.0;
    letter-spacing: -1.5px;
    text-align: center;
    color: #fff;
  }
  h1 .accent { color: #faed36; font-weight: 700; }

  .subtitle {
    margin-top: 16px;
    font-size: 20px;
    line-height: 1.45;
    color: #9fb2c9;
    font-weight: 400;
    text-align: center;
    max-width: 760px;
  }

  /* Mini tile preview */
  .tiles {
    margin-top: 34px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    width: 100%;
    max-width: 900px;
  }
  .tile {
    background: #0f1520;
    border: 1px solid #253245;
    border-radius: 14px;
    padding: 22px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
  }
  .tile-icon {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 12px;
    background: rgba(45, 125, 210, 0.12);
    border: 1px solid rgba(74, 154, 232, 0.22);
    color: #4a9ae8;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tile-icon svg { width: 22px; height: 22px; stroke: currentColor; }
  .tile-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .tile-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: #faed36;
  }
  .tile-desc {
    font-size: 11px;
    color: #8892a4;
    line-height: 1.4;
  }

  /* Footer */
  .footer {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.08);
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .domain {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.2px;
  }
  .domain .acc { color: #faed36; }
  .domain .dim { color: #5d6679; font-weight: 500; }
  .tag {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #9fb2c9;
    font-weight: 700;
  }
  .tag .gold { color: #faed36; }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="grid"></div>

<div class="frame">
  <div class="logo"><img src="../assets/cnat-logo-white.png" alt="CNAT Title"></div>

  <h1>The CNAT <span class="accent">Tech Hub</span></h1>
  <p class="subtitle">Smart tools and resources built to help you close faster, stay informed, and work smarter.</p>

  <div class="tiles">
    <div class="tile">
      <div class="tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="18" height="13" rx="2"></rect>
          <path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <path d="M3 13h18"></path>
        </svg>
      </div>
      <div class="tile-text">
        <div class="tile-title">Agents &amp; Lenders</div>
        <div class="tile-desc">Tools for real estate pros</div>
      </div>
    </div>

    <div class="tile">
      <div class="tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11.5 12 4l9 7.5"></path>
          <path d="M5 10v10h14V10"></path>
          <path d="M10 20v-5h4v5"></path>
        </svg>
      </div>
      <div class="tile-text">
        <div class="tile-title">Public</div>
        <div class="tile-desc">For homebuyers &amp; sellers</div>
      </div>
    </div>

    <div class="tile">
      <div class="tile-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="11" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          <circle cx="12" cy="15.5" r="1.25"></circle>
        </svg>
      </div>
      <div class="tile-text">
        <div class="tile-title">Internal</div>
        <div class="tile-desc">Team tools &amp; operations</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="domain">ai<span class="dim">.</span>cnattitle<span class="dim">.com</span></div>
    <div class="tag">#AlwaysBeClosing <span class="gold">&middot; Texas Style</span></div>
  </div>
</div>
</body>
</html>
